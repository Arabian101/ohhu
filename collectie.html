<!DOCTYPE html>
<html lang="nl" style="background:#0a0a0a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collectie | JAEGER</title>
<meta name="description" content="Ontdek de JAEGER collectie premium kappersscharen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#0a0a0a; --panel:#141414; --line:#2a2a2a;
  --gold:#c9a24b; --gold-light:#e6c878; --white:#f5f2ea; --muted:#a8a39a;
  --serif:'Playfair Display',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--black);color:var(--white);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,.logo{font-family:var(--serif);font-weight:500}
h2{font-size:clamp(2rem,4vw,3.2rem);line-height:1.2;margin-bottom:1.2rem}
p{margin-bottom:1rem;color:#d8d4ca}
.wrap{max-width:1180px;margin:0 auto;padding:0 1.5rem}
section{padding:7rem 0}
.eyebrow{color:var(--gold);letter-spacing:.3em;text-transform:uppercase;font-size:.75rem;font-weight:500}
em{color:var(--gold);font-style:italic}

/* Buttons */
.btn{display:inline-block;background:var(--gold);color:var(--black);padding:.9rem 2rem;border:1px solid var(--gold);
  font:500 .8rem var(--sans);letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:.3s}
.btn:hover{background:transparent;color:var(--gold)}
.btn.ghost{background:transparent;color:var(--white);border-color:var(--line);margin-left:.8rem}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold)}

/* Nav */
header{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:1.2rem 2rem;transition:.4s}
header.solid{background:rgba(10,10,10,.92);backdrop-filter:blur(10px);padding:.8rem 2rem;border-bottom:1px solid var(--line)}
.logo{font-size:1.6rem;letter-spacing:.35em;color:var(--white)}
nav{display:flex;gap:2.2rem}
nav a{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;position:relative;padding:.3rem 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--gold);transition:.3s}
nav a:hover::after{width:100%}
#cartBtn{background:none;border:1px solid var(--gold);color:var(--gold);padding:.5rem 1.1rem;font:400 .75rem var(--sans);
  letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.3s}
#cartBtn:hover{background:var(--gold);color:var(--black)}
#cartCount{margin-left:.4rem;font-weight:500}
#burger{display:none;background:none;border:0;width:30px;height:20px;position:relative;cursor:pointer}
#burger span{position:absolute;left:0;width:100%;height:2px;background:var(--gold);transition:.3s}
#burger span:first-child{top:4px}#burger span:last-child{bottom:4px}

/* Hero */
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;
  padding:8rem 5vw 4rem;position:relative;
  background:radial-gradient(ellipse at 75% 50%,#1d1708 0,var(--black) 60%)}
.hero h1{font-size:clamp(2.8rem,6.5vw,5.5rem);line-height:1.05;margin:1rem 0 1.5rem}
.lead{font-size:1.15rem;max-width:34rem;margin-bottom:2.2rem}
.hero-art{position:relative;display:grid;place-items:center}
.big-scissors{width:min(420px,80%);aspect-ratio:1;color:var(--gold);transform:rotate(12deg);
  filter:drop-shadow(0 0 30px rgba(201,162,75,.35));animation:float 6s ease-in-out infinite}
.glow{position:absolute;width:60%;aspect-ratio:1;border:1px solid var(--line);border-radius:50%;animation:spin 40s linear infinite}
.glow::after{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;background:var(--gold);border-radius:50%}
@keyframes float{50%{transform:rotate(8deg) translateY(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.scroll-hint{position:absolute;bottom:1.5rem;left:50%;transform:translateX(-50%);font-size:.7rem;letter-spacing:.3em;
  text-transform:uppercase;color:var(--muted);padding-bottom:2.2rem}
.scroll-hint::after{content:"";position:absolute;bottom:0;left:50%;width:1px;height:1.8rem;background:var(--gold);animation:drop 2s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* Promo */
.promo{padding:0}
.marquee{overflow:hidden;background:var(--gold);color:var(--black);padding:.9rem 0;white-space:nowrap}
.marquee div{display:inline-flex;animation:scroll 30s linear infinite}
.marquee span{font-size:.8rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;padding:0 2rem}
.marquee span::after{content:"◆";margin-left:4rem}
@keyframes scroll{to{transform:translateX(-50%)}}
.ad{max-width:1180px;margin:4rem auto;padding:3rem;border:1px solid var(--gold);display:flex;justify-content:space-between;
  align-items:center;gap:2rem;flex-wrap:wrap;background:linear-gradient(120deg,#17120a,var(--panel))}
.ad h2{font-size:clamp(1.6rem,3vw,2.4rem);margin:.5rem 0}
.ad p{margin:0}.ad strong{color:var(--gold)}

/* Story */
.story{background:var(--panel)}
.split{display:grid;grid-template-columns:1fr 1.2fr;gap:4rem;align-items:start}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:5rem;padding-top:3rem;border-top:1px solid var(--line);text-align:center}
.stats b{display:block;font:500 clamp(2rem,4vw,3rem) var(--serif);color:var(--gold)}
.stats span{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* Collection */
.collection h2{margin-bottom:2rem}
.filters{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:3rem}
.filters button{background:none;border:1px solid var(--line);color:var(--muted);padding:.5rem 1.2rem;cursor:pointer;
  font:400 .75rem var(--sans);letter-spacing:.12em;text-transform:uppercase;transition:.3s}
.filters button:hover,.filters button.on{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.5rem}
.card{background:var(--panel);border:1px solid var(--line);transition:.4s;display:flex;flex-direction:column}
.card:hover{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.card .img{aspect-ratio:1;display:grid;place-items:center;background:radial-gradient(circle,#211a0b,var(--black) 70%);position:relative;overflow:hidden}
.card .img svg{width:55%;aspect-ratio:1;color:var(--gold);transform:rotate(12deg);transition:.6s}
.card:hover .img svg{transform:rotate(-8deg) scale(1.1)}
.tag{position:absolute;top:1rem;left:1rem;background:var(--gold);color:var(--black);font-size:.65rem;letter-spacing:.15em;
  text-transform:uppercase;padding:.2rem .7rem;font-weight:500}
.card .body{padding:1.5rem;display:flex;flex-direction:column;flex:1}
.card h3{font-size:1.3rem;margin-bottom:.4rem}
.card p{font-size:.88rem;color:var(--muted);flex:1}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.price{font:500 1.3rem var(--serif);color:var(--gold)}
.add{background:none;border:1px solid var(--gold);color:var(--gold);padding:.5rem 1rem;cursor:pointer;
  font:500 .7rem var(--sans);letter-spacing:.12em;text-transform:uppercase;transition:.3s}
.add:hover{background:var(--gold);color:var(--black)}

/* About */
.about{background:var(--panel);text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:3rem;text-align:left}
.cards article{padding:2.2rem;border:1px solid var(--line);border-top:2px solid var(--gold);background:var(--black)}
.cards h3{color:var(--gold);margin-bottom:.8rem;font-size:1.4rem}
.cards p{margin:0;font-size:.95rem}

/* Contact */
.info{list-style:none;margin-top:2rem}
.info li{padding:.8rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.info b{display:inline-block;width:8rem;color:var(--gold);font-weight:500;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase}
form{display:grid;gap:1.3rem}
label{font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
input,textarea{display:block;width:100%;margin-top:.5rem;background:var(--panel);border:1px solid var(--line);color:var(--white);
  padding:.9rem 1rem;font:300 1rem var(--sans);transition:.3s}
input:focus,textarea:focus{outline:0;border-color:var(--gold)}
input.bad,textarea.bad{border-color:#b5483c}
#formMsg{color:var(--gold);margin:0;min-height:1.5rem}

footer{text-align:center;padding:3.5rem 1.5rem;border-top:1px solid var(--line)}
footer .logo{font-size:1.4rem;margin-bottom:1rem}
footer p{font-size:.8rem;color:var(--muted);margin-bottom:.4rem}
footer a:hover{color:var(--gold)}

/* Cart */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:.3s;z-index:90}
#cart{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--gold);
  z-index:100;transform:translateX(100%);transition:.45s cubic-bezier(.7,0,.2,1);display:flex;flex-direction:column}
body.cart-open #cart{transform:none}
body.cart-open #overlay{opacity:1;pointer-events:auto}
.cart-head{display:flex;justify-content:space-between;align-items:center;padding:1.5rem;border-bottom:1px solid var(--line)}
.cart-head button{background:none;border:0;color:var(--white);font-size:2rem;cursor:pointer;line-height:1}
#cartItems{flex:1;overflow:auto;padding:1rem 1.5rem}
.item{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.item small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:.6rem;margin-top:.4rem}
.qty button{width:26px;height:26px;background:none;border:1px solid var(--line);color:var(--white);cursor:pointer}
.qty button:hover{border-color:var(--gold);color:var(--gold)}
.empty{color:var(--muted);text-align:center;margin-top:3rem}
.cart-foot{padding:1.5rem;border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;margin-bottom:1rem}
.total b{color:var(--gold);font:500 1.4rem var(--serif)}
.cart-foot .btn{width:100%}
#toast{position:fixed;bottom:2rem;left:50%;transform:translate(-50%,200%);background:var(--gold);color:var(--black);
  padding:.8rem 1.6rem;font-size:.85rem;font-weight:500;z-index:200;transition:.4s}
#toast.show{transform:translate(-50%,0)}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

@media(max-width:900px){
  section{padding:5rem 0}
  .hero{grid-template-columns:1fr;text-align:center;padding-top:7rem}
  .lead{margin-inline:auto}.hero-art{order:-1;max-height:280px}.big-scissors{width:200px}
  .split,.cards{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:2rem}
  #burger{display:block;order:3}
  nav{position:fixed;inset:0 0 0 30%;background:var(--black);border-left:1px solid var(--gold);flex-direction:column;
    justify-content:center;align-items:center;transform:translateX(100%);transition:.4s}
  nav.open{transform:none}
  .btn.ghost{margin:.8rem 0 0}
  .ad{margin:3rem 1.5rem;padding:2rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* Meerdere pagina's */
nav a.active{color:var(--gold)}
nav a.active::after{width:100%}
.sub-first{padding-top:10rem}
.hero{grid-template-columns:1fr;justify-items:center;text-align:center;overflow:hidden}
.hero-text{position:relative;z-index:2;max-width:900px}
.hero-art{position:absolute;inset:0;z-index:1;opacity:.16;pointer-events:none;max-height:none;order:0}
.big-scissors{width:min(560px,80vw)}
.hero h1{display:flex;flex-direction:column;gap:.8rem;margin:0 0 2.5rem}
.hero h1 .l1{font:500 clamp(.9rem,2.2vw,1.4rem) var(--sans);letter-spacing:.35em;text-transform:uppercase;color:var(--white)}
.hero h1 .l2{font-size:clamp(3.2rem,9vw,7rem);line-height:1.05;color:#8a867d}
.stats{grid-template-columns:repeat(2,1fr);max-width:640px;margin:5rem auto 0;padding-top:0;border-top:0}
.cards{grid-template-columns:repeat(2,1fr);max-width:900px;margin-inline:auto}
@media(max-width:900px){.cards{grid-template-columns:1fr}.sub-first{padding-top:8rem}}

/* Home uitgebreid */
.usp{padding:0;background:var(--panel);border-block:1px solid var(--line)}
.usp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;padding-block:2.5rem;text-align:center}
.usp b{display:block;font:500 1.15rem var(--serif);color:var(--gold);margin-bottom:.2rem}
.usp span{font-size:.8rem;color:var(--muted)}
.sub{max-width:36rem;color:var(--muted);margin-bottom:3rem}
.center-btn{text-align:center;margin-top:3.5rem}
.process h2{margin-bottom:3rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
.steps article{padding:2rem;border:1px solid var(--line);background:var(--panel);transition:.4s}
.steps article:hover{border-color:var(--gold);transform:translateY(-6px)}
.steps span{font:500 2.4rem var(--serif);color:var(--gold);opacity:.5}
.steps h3{font-size:1.4rem;margin:.4rem 0 .6rem}
.steps p{margin:0;font-size:.9rem;color:var(--muted)}
.quote{text-align:center;padding:9rem 1.5rem;background:radial-gradient(ellipse at center,#1d1708,var(--black) 70%);border-block:1px solid var(--line)}
.quote blockquote{font:italic 500 clamp(1.8rem,4.5vw,3.4rem)/1.35 var(--serif);max-width:880px;margin:0 auto 2rem}
.materials{background:var(--panel)}
.specs div{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.specs dt{color:var(--gold);font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;font-weight:500}
.specs dd{text-align:right}
.reviews h2{margin-bottom:3rem}
.cards.three{grid-template-columns:repeat(3,1fr);max-width:none}
.cards.three article{background:var(--panel)}
.cards.three p{font:italic 1.05rem/1.7 var(--serif);margin-bottom:1.5rem}
.cards.three b{display:block;color:var(--gold);font-weight:500}
.cards.three small{color:var(--muted)}
.cta-final{text-align:center;background:linear-gradient(180deg,var(--panel),#17120a);border-top:1px solid var(--line)}
@media(max-width:900px){.usp-grid,.steps{grid-template-columns:repeat(2,1fr)}.cards.three{grid-template-columns:1fr}.quote{padding:6rem 1.5rem}}

</style>
</head>
<body>
<main>
<section id="collectie" class="collection sub-first">
  <div class="wrap">
    <p class="eyebrow reveal">Collectie</p>
    <h2 class="reveal">Kies je JAEGER</h2>
    <div class="filters reveal" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
</section>
</main>
<script>
'use strict';

/* ---------- Gedeelde onderdelen (header, footer, winkelwagen) op elke pagina ---------- */
const page = location.pathname.split('/').pop() || 'index.html';
const navLink = (h, t) => `<a href="${h}"${page === h ? ' class="active"' : ''}>${t}</a>`;

document.body.insertAdjacentHTML('afterbegin', `
<svg width="0" height="0" style="position:absolute">
  <symbol id="scissors" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
    <circle cx="28" cy="80" r="12"/><circle cx="72" cy="80" r="12"/><path d="M32 69 L80 6 M68 69 L20 6"/>
  </symbol>
</svg>
<header id="nav">
  <a href="index.html" class="logo">JAEGER</a>
  <nav id="menu">${navLink('collectie.html', 'Collectie')}${navLink('vakmanschap.html', 'Vakmanschap')}${navLink('contact.html', 'Contact')}</nav>
  <button id="cartBtn" aria-label="Winkelwagen">Winkelwagen <span id="cartCount">0</span></button>
  <button id="burger" aria-label="Menu"><span></span><span></span></button>
</header>`);

document.body.insertAdjacentHTML('beforeend', `
<footer>
  <div class="logo">JAEGER</div>
  <p>© <span id="year"></span> JAEGER Professional Scissors · KvK 12345678 · BTW NL001234567B01</p>
  <p><a href="#">Algemene voorwaarden</a> · <a href="#">Privacy</a> · <a href="#">Retourneren</a></p>
</footer>
<div id="overlay"></div>
<aside id="cart" aria-label="Winkelwagen">
  <div class="cart-head"><h3>Winkelwagen</h3><button id="closeCart" aria-label="Sluiten">×</button></div>
  <div id="cartItems"></div>
  <div class="cart-foot">
    <div class="total"><span>Totaal (incl. btw)</span><b id="cartTotal">€ 0,00</b></div>
    <button class="btn" id="checkout">Afrekenen met iDEAL</button>
  </div>
</aside>
<div id="toast"></div>`);

/* ---------- Productdata ---------- */
const products = [
  {id:1, name:'JAEGER Classic 6.0"', cat:'Knipschaar', price:289, tag:'Bestseller', desc:'Offset handvat, VG10-staal en een vlijmscherpe convexe snede. De standaard voor dagelijks gebruik.'},
  {id:2, name:'JAEGER Master 5.5"', cat:'Knipschaar', price:349, tag:'Nieuw', desc:'Compact en extreem gebalanceerd. Ideaal voor precisiewerk en detailsnedes.'},
  {id:3, name:'JAEGER Gold Edition 6.5"', cat:'Knipschaar', price:489, tag:'Limited', desc:'Gepolijst 440C-staal met gouden titanium coating en handgraveerd logo.'},
  {id:4, name:'JAEGER Texturizer 30T', cat:'Effileerschaar', price:259, tag:'', desc:'30 tanden voor zachte overgangen en natuurlijke textuur zonder trekken.'},
  {id:5, name:'JAEGER Thinning 40T', cat:'Effileerschaar', price:269, tag:'', desc:'Verwijdert volume gelijkmatig en soepel. Geslepen voor dik en weerbarstig haar.'},
  {id:6, name:'JAEGER Lefty 6.0"', cat:'Linkshandig', price:299, tag:'', desc:'Echt linkshandig ontworpen, geen gespiegeld model. Voor volledig natuurlijk gebruik.'},
  {id:7, name:'JAEGER Duo Set', cat:'Sets', price:519, tag:'-10%', desc:'Classic 6.0" plus Texturizer 30T in een luxe leren etui met onderhoudsset.'},
  {id:8, name:'JAEGER Onderhoudsset', cat:'Accessoires', price:39, tag:'', desc:'Scharenolie, microvezeldoek en reinigingsdoekje voor een lange levensduur.'}
];

const euro = n => '€ ' + n.toFixed(2).replace('.', ',');
const $ = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => [...c.querySelectorAll(s)];

/* ---------- Collectie renderen + filter ---------- */
const grid = $('#grid') || document.createElement('div'), filters = $('#filters') || document.createElement('div');
const cats = ['Alles', ...new Set(products.map(p => p.cat))];

filters.innerHTML = cats.map((c, i) => `<button class="${i ? '' : 'on'}" data-cat="${c}">${c}</button>`).join('');

const cardHTML = p => `
    <article class="card reveal">
      <div class="img">${p.tag ? `<span class="tag">${p.tag}</span>` : ''}<svg><use href="#scissors"/></svg></div>
      <div class="body">
        <small class="eyebrow">${p.cat}</small>
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <div class="row"><span class="price">${euro(p.price)}</span>
        <button class="add" data-id="${p.id}">In winkelwagen</button></div>
      </div>
    </article>`;

function renderProducts(cat = 'Alles') {
  const list = cat === 'Alles' ? products : products.filter(p => p.cat === cat);
  grid.innerHTML = list.map(cardHTML).join('');
  observe();
}

/* De eerste vier scharen op de homepage */
const featured = $('#featured');
if (featured) featured.innerHTML = products.slice(0, 4).map(cardHTML).join('');
filters.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  $$('button', filters).forEach(x => x.classList.toggle('on', x === b));
  renderProducts(b.dataset.cat);
});

/* ---------- Winkelwagen ---------- */
let cart = [];
try { cart = JSON.parse(localStorage.getItem('jaegerCart')) || []; } catch (e) {}

function saveCart() { try { localStorage.setItem('jaegerCart', JSON.stringify(cart)); } catch (e) {} }

function renderCart() {
  const box = $('#cartItems');
  if (!cart.length) box.innerHTML = '<p class="empty">Je winkelwagen is nog leeg.</p>';
  else box.innerHTML = cart.map(i => {
    const p = products.find(x => x.id === i.id);
    return `<div class="item"><div><b>${p.name}</b><br><small>${euro(p.price)}</small>
      <div class="qty"><button data-act="min" data-id="${p.id}">−</button><span>${i.qty}</span><button data-act="plus" data-id="${p.id}">+</button></div></div>
      <b>${euro(p.price * i.qty)}</b></div>`;
  }).join('');
  const total = cart.reduce((s, i) => s + products.find(p => p.id === i.id).price * i.qty, 0);
  $('#cartTotal').textContent = euro(total);
  $('#cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
  saveCart();
}

function changeQty(id, d) {
  const item = cart.find(i => i.id === id);
  if (!item) { if (d > 0) cart.push({id, qty: 1}); }
  else { item.qty += d; if (item.qty <= 0) cart = cart.filter(i => i.id !== id); }
  renderCart();
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}
const toggleCart = open => document.body.classList.toggle('cart-open', open);

document.addEventListener('click', e => {
  const b = e.target.closest('.add'); if (!b) return;
  changeQty(+b.dataset.id, 1); toast('Toegevoegd aan winkelwagen');
});
$('#cartItems').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  changeQty(+b.dataset.id, b.dataset.act === 'plus' ? 1 : -1);
});
$('#cartBtn').onclick = () => toggleCart(true);
$('#closeCart').onclick = $('#overlay').onclick = () => toggleCart(false);
$('#checkout').onclick = () => toast(cart.length ? 'Demo: koppel hier je betaalprovider (bijv. Mollie)' : 'Je winkelwagen is leeg');

/* ---------- Navigatie ---------- */
const nav = $('#nav'), menu = $('#menu');
addEventListener('scroll', () => nav.classList.toggle('solid', scrollY > 50), {passive: true});
$('#burger').onclick = () => menu.classList.toggle('open');
$$('a', menu).forEach(a => a.onclick = () => menu.classList.remove('open'));

/* ---------- Scroll-reveal ---------- */
const io = new IntersectionObserver((entries, o) => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const el = en.target;
    el.style.transitionDelay = (el.dataset.delay || 0) + 'ms';
    el.classList.add('in'); o.unobserve(el);
    if (el.parentElement.classList.contains('stats')) countUp($('b', el));
  });
}, {threshold: .15});

function observe() {
  $$('.reveal:not(.in)').forEach((el, i) => {
    const sib = [...el.parentElement.children].indexOf(el);
    el.dataset.delay = Math.min(sib, 5) * 120;
    io.observe(el);
  });
}

/* ---------- Tellers ---------- */
function countUp(el) {
  const target = +el.dataset.count, dur = 1600, start = performance.now();
  const suffix = el.hasAttribute('data-plus') ? '+' : el.hasAttribute('data-pct') ? '%' : '';
  (function tick(now) {
    const p = Math.min((now - start) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString('nl-NL') + suffix;
    if (p < 1) requestAnimationFrame(tick);
  })(start);
}

/* ---------- Contactformulier ---------- */
$('#contactForm')?.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, msg = $('#formMsg'); let ok = true;
  $$('input,textarea', f).forEach(i => {
    const valid = i.value.trim() && (i.type !== 'email' || /^\S+@\S+\.\S+$/.test(i.value));
    i.classList.toggle('bad', !valid); if (!valid) ok = false;
  });
  msg.textContent = ok ? 'Bedankt! We nemen binnen één werkdag contact met je op.' : 'Controleer de gemarkeerde velden.';
  if (ok) f.reset(); // Koppel hier een backend/e-mailservice voor echte verzending
});

/* ---------- Start ---------- */
$('#year').textContent = new Date().getFullYear();
renderProducts();
renderCart();

</script>
