<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | JAEGER</title>
<meta name="description" content="Neem contact op met JAEGER voor advies of vragen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<section id="contact" class="contact sub-first">
  <div class="wrap split">
    <div class="reveal">
      <p class="eyebrow">Contact</p>
      <h2>Vragen? Wij helpen je graag.</h2>
      <p>Twijfel je over de juiste maat of wil je advies over slijpen? Ons team antwoordt binnen één werkdag.</p>
      <ul class="info">
        <li><b>E-mail</b> info@jaeger-scharen.nl</li>
        <li><b>Telefoon</b> +31 (0)20 123 45 67</li>
        <li><b>Adres</b> Ambachtsweg 12, 1234 AB Amsterdam</li>
        <li><b>Openingstijden</b> ma – vr, 09:00 – 17:30</li>
      </ul>
    </div>
    <form id="contactForm" class="reveal" novalidate>
      <label>Naam<input type="text" name="naam" required></label>
      <label>E-mailadres<input type="email" name="email" required></label>
      <label>Bericht<textarea name="bericht" rows="5" required></textarea></label>
      <button class="btn" type="submit">Verstuur bericht</button>
      <p id="formMsg" role="status"></p>
    </form>
  </div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
